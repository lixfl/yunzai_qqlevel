taskGroups:
  - id: 群组相关
    type: func
    preTasks: []
    tasks:
      - id: 群打卡
        desc: 新版群打卡（没什么用）
        cron: 0 $minute $hour * * *
        relay:
        rear:
        envs:
          - name: groups
            type: group
            limit: 0
            default: ''
            desc: 打卡的群组列表，点击此卡片可打开群组多选列表
          - name: hour
            type: num
            limit: 23
            default: 0
            desc: 自定义打卡时间-小时
          - name: minute
            type: num
            limit: 59
            default: 0
            desc: 自定义打卡时间-分钟（任务一般是10分钟的倍数执行，无法精确到具体的分钟）
        conditions:
        repeat: 1
        delay: 2
        reqUrl: xa://GroupSignInManager/signIn?uin=${groups}$
        reqMethod: get
        reqHeaders: {}
        reqData:
        domain:
        callback:
          dataRegex:
          extracts:
          assert:
          sucMsg:
          errMsg:
          replaces: []
      - id: 群组续火
        desc: 群组续火，时间默认0点执行，可自定义
        cron: 0 $minute $hour * * *
        relay:
        rear:
        envs:
          - name: groups
            type: group
            limit: 20
            default: ''
            desc: 发言的群组列表，点击此卡片可打开群组多选列表
          - name: message
            type: randString
            limit: 20
            default: ''
            desc: 自定义续火文字，随机选择，多个文字之间使用|(英文符号)隔开
          - name: hour
            type: num
            limit: 23
            default: 0
            desc: 自定义续火时间-小时
          - name: minute
            type: num
            limit: 59
            default: 0
            desc: 自定义续火时间-分钟（任务一般是10分钟的倍数执行，无法精确到具体的分钟）
        conditions:
        repeat: 1
        delay: 10
        reqUrl: xa://SendMessageManager/sendMessage/group?uin=${groups}$&msg=${message}$
        reqMethod: get
        reqHeaders: {}
        reqData:
        domain:
        callback:
          dataRegex:
          extracts:
          assert:
          sucMsg:
          errMsg:
          replaces: []
  - id: 好友相关
    type: func
    preTasks: []
    tasks:
      - id: 好友点赞
        desc: QQ资料卡点赞，打开卡片可选择好友
        cron: 0 0 0 * * *
        relay:
        rear:
        envs:
          - name: friends
            type: friend
            limit: 0
            default: ''
            desc: 点赞的好友列表，点击此卡片可打开好友多选列表
        conditions:
        repeat: 1
        delay: 2
        reqUrl: xa://FavoriteManager/favorite?uin=${friends}$
        reqMethod: get
        reqHeaders: {}
        reqData:
        domain:
        callback:
          dataRegex:
          extracts:
          assert:
          sucMsg:
          errMsg:
          replaces: []
      - id: 好友续火花
        desc: 好友续火花，时间默认7点执行，可自定义
        cron: 0 $minute $hour * * *
        relay:
        rear:
        envs:
          - name: friends
            type: friend
            limit: 0
            default: ''
            desc: 续火的好友列表，点击此卡片可打开好友多选列表
          - name: message
            type: randString
            limit: 20
            default: ''
            desc: 自定义续火文字，随机选择，多个文字之间使用|(英文符号)隔开，例如：🔥|早啊|早安|早上好|🔥🔥🔥
          - name: hour
            type: num
            limit: 23
            default: 7
            desc: 自定义续火时间-小时
          - name: minute
            type: num
            limit: 59
            default: 0
            desc: 自定义续火时间-分钟
        conditions:
        repeat: 1
        delay: 10
        reqUrl: xa://SendMessageManager/sendMessage/friend?uin=${friends}$&msg=${message}$
        reqMethod: get
        reqHeaders: {}
        reqData:
        domain:
        callback:
          dataRegex:
          extracts:
          assert:
          sucMsg:
          errMsg:
          replaces: []
  - id: 频道相关
    type: web
    preTasks: []
    tasks:
      - id: 频道签到
        desc: 可得活跃值，时间默认0点执行，可自定义
        cron: 0 $minute $hour * * *
        relay:
        rear:
        envs:
          - name: guilds
            type: guild
            limit: 0
            default: ''
            desc: 签到的频道列表，点击此卡片可打开频道多选列表
          - name: hour
            type: num
            limit: 23
            default: 0
            desc: 自定义签到时间-小时
          - name: minute
            type: num
            limit: 59
            default: 0
            desc: 自定义签到时间-分钟
        conditions:
        repeat: 1
        delay: 2
        reqUrl: https://qun.qq.com/qunng/http2rpc/gotrpc/v1/trpc.group_pro.guild_checkin_svr.GuildCheckinSvr/handleProcess2?bkn=${ps_tk}$&psk=1
        reqMethod: post
        reqHeaders:
          x-oidb: '{"uint32_service_type":2,"uint32_command":"0x91cc"}'
        reqData: '{"guild_id":"${guilds}$"}'
        domain: qun.qq.com
        callback:
          dataRegex:
          extracts:
            - from: data
              match: $.retcode
              key: ret
              value: $this
            - from: data
              match: $.message
              key: msg
              value: $this
          assert:
            key: $ret
            value: 0
          sucMsg: 签到成功
          errMsg: 签到失败：$msg
          replaces:
            - match: '\[backend\] repeated checkin'
              replacement: '今日已签到'
