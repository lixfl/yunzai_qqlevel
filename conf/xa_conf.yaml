    desc: 据反馈，存在群消息被禁止发送的情况【你的帐号因系统检测或多人举报涉及进行业务违规操作，暂不能发送群消息。】，现将续火延迟从2s调整为10s，同时不建议勾选过多的群聊进行续火、以及配置多条消息随机发送，降低检测风险
