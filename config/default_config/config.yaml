# yunzai_qqlevel 配置文件示例
# 用户可以修改此文件定制插件行为
# 路径: config/config.yaml (不存在会自动复制本示例)

# ============================================
# 基础配置
# ============================================

# 默认操作的 QQ 号 (登录后会自动填充)
defaultUin: ""

# 一键签到默认范围
# 'all' = 全部已启用, 'enabled' = 同 all, 'web' = 仅 web 任务, 'func' = 仅 func
oneClickScope: "all"

# 群白名单 (留空 = 不限制,所有群)
# 续火/打卡/抽字符只在这些群内执行
whitelist: []

# 群黑名单 (优先级高于白名单)
blacklist: []

# 抽字符设置
luckyChar:
  enabled: true   # 是否启用抽字符
  isSVIP: false   # bot 是否 SVIP (影响抽字符次数)

# 默认续火文案 (任务未指定时使用)
defaultMessage: "火"

# 自定义登录域 (高级用户用)
# 在这里添加从浏览器 F12 抓到的 s_url/daid/appid 三元组
customLoginDomains:
  # 例子: ti.qq.com (QQ打卡/字符)
  # ti.qq.com:
  #   s_url: "https://ti.qq.com/hybrid-h5/index"
  #   daid: "76"
  #   appid: "30014"

# 任务启用状态覆盖
# 在这里可以批量启用/禁用任务
# true = 强制启用, false = 强制禁用, 不写 = 使用 data/tasks-state.json 的设置
taskOverrides:
  # 群打卡: true
  # 波点音乐听歌: false

# ============================================
# 时间配置
# ============================================

# 全局默认签到时间
# 6 段 cron 表达式: 秒 分 时 日 月 周
# 留空 = 每个任务使用自己的 cron
dailyRunTime: ""

# 全局默认时间 (简化格式, 优先级高于 dailyRunTime)
# "HH:MM" 形式,每天固定时间执行所有任务
# 例如 "08:00" = 每天早 8 点
# defaultTime: "08:00"

# 每个任务的执行时间覆盖
# 优先级: 任务 cron > 这里的覆盖 > xa_conf.yaml 默认
#
# 支持 3 种格式:
#   1. 简化时间 "HH:MM" — 每天固定时间
#   2. cron 表达式 (6 段) — 完全控制
#   3. 字符串 "disable"   — 禁用该任务的定时 (只手动执行)
taskCronOverrides:
  # 群打卡: "08:00"           # 每天早 8 点
  # 群组续火: "09:30"         # 每天 9:30
  # 好友续火花: "12:00"
  # 加好友活跃: "07:30"
  # 日签卡打卡: "11:45"
  # 连续登陆QQ: "13:20"
  # 福利社领券: "14:00"
  # 空间说说任务: "15:30"
  # 波点音乐听歌: disable      # 禁用定时
  # QQ晚安卡: "0 0 20 * * *"  # 完整 cron
  # QQ收集卡: "0 30 7 * * *"
  # 好友点赞: "0 0 12 * * *"
  # QQ字符抽取: "0 0 0 * * *"
  # 频道签到: "10:15"

# ============================================
# 高级配置
# ============================================

# HTTP 请求超时 (毫秒)
httpTimeout: 15000

# 重试次数 (失败后重试)
retryCount: 1

# 错峰执行 (任务间延迟,毫秒)
# 防止被风控检测到并发
staggerDelay: 2000
